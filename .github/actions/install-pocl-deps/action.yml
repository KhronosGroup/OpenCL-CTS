name: 'Install POCL Dependencies'
description: 'Installs dependencies needed to build and run POCL'
runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update
        export LLVM_VERSION=20
        sudo apt-get install -y \
          python3-dev libpython3-dev build-essential ocl-icd-libopencl1 \
          cmake git pkg-config libclang-${LLVM_VERSION}-dev clang-${LLVM_VERSION} \
          llvm-${LLVM_VERSION} make ninja-build ocl-icd-libopencl1 ocl-icd-dev \
          ocl-icd-opencl-dev libhwloc-dev zlib1g zlib1g-dev clinfo dialog apt-utils \
          libxml2-dev libclang-cpp${LLVM_VERSION}-dev libclang-cpp${LLVM_VERSION} \
          llvm-${LLVM_VERSION}-dev

    - name: Build and install SPIRV-LLVM-Translator
      shell: bash
      run: |
        export LLVM_VERSION=20
        export TRANSLATOR_BRANCH=llvm_release_200
        export TRANSLATOR_SRC_DIR=${RUNNER_TEMP}/SPIRV-LLVM-Translator
        export TRANSLATOR_BUILD_DIR=${TRANSLATOR_SRC_DIR}/build
        export TRANSLATOR_INSTALL_PREFIX=$(realpath ${GITHUB_WORKSPACE}/../spirv-llvm-translator-install)

        git clone --depth 1 --branch ${TRANSLATOR_BRANCH} https://github.com/KhronosGroup/SPIRV-LLVM-Translator.git ${TRANSLATOR_SRC_DIR}

        cmake -S ${TRANSLATOR_SRC_DIR} -B ${TRANSLATOR_BUILD_DIR} -G Ninja \
          -DCMAKE_INSTALL_PREFIX=${TRANSLATOR_INSTALL_PREFIX} \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm
        cmake --build ${TRANSLATOR_BUILD_DIR}
        cmake --install ${TRANSLATOR_BUILD_DIR}

        echo "SPIRV_LLVM_TRANSLATOR_PATH=${TRANSLATOR_INSTALL_PREFIX}" >> $GITHUB_ENV
